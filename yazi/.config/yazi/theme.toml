[mgr]
cwd = { bg = "black", underline = true }
border_style = { hidden = true }
syntect_theme = "~/.config/yazi/nothing.tmTheme"

[status]
progress_label = { fg = "black", bold = true }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

[indicator]
current = { reversed = true }
padding = { open = "▐", close = "▌" }
preview = { underline = false }

[icon]
globs = []
dirs  = []
files = []
exts  = []
conds = []

[mode]
normal_main = { bg = "black", bold = false }
normal_alt = { bg = "black", bold = false }
select_main = { reversed = true, bold = false }
select_alt = { bg = "black", bold = false }
unset_main  = { bg = "black", bold = false }
unset_alt  = { bg = "black", bold = false }

[filetype]
rules = [
	# Fallback
	{ url = "*/", bold = true },
  { url = "*", fg = "grey" }
]
