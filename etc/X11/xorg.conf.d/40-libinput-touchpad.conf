Section "InputClass"
	  Identifier "libinput touchpad catchall"
    MatchIsTouchpad "on"
    Driver "libinput"

    Option "AccelProfile" "adaptive"
    Option "AccelSpeed" "0.3"
    Option "NaturalScrolling" "true"
    Option "Tapping" "on"
    Option "TappingDrag" "on"
    Option "DisableWhileTyping" "on"
EndSection
