Section "InputClass"
    Identifier "ThinkPad Synaptics TouchPad"
    MatchProduct "SynPS/2 Synaptics TouchPad"
    MatchIsTouchpad "on"
    Driver "synaptics"

    Option "TapButton1" "1"
    Option "TapButton2" "0"
    Option "TapButton3" "2"

    Option "VertTwoFingerScroll" "on"
    Option "HorizTwoFingerScroll" "on"
    Option "VertEdgeScroll" "off"
    Option "HorizEdgeScroll" "off"

    Option "PalmDetect" "1"
    Option "PalmMinWidth" "16"
    Option "PalmMinZ" "100"

    Option "VertScrollDelta" "-280"
    Option "HorizScrollDelta" "-111"
    Option "MinSpeed" "0.4"
    Option "MaxSpeed" "1.4"
    Option "AccelFactor" "0.045"
EndSection
