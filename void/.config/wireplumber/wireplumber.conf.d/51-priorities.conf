# https://danielpower.ca/blog/wireplumber-device-priority
# https://pipewire.pages.freedesktop.org/wireplumber/daemon/configuration/settings.html
# https://pipewire.pages.freedesktop.org/wireplumber/daemon/configuration/bluetooth.html
# Pre-requisite: wpctl clear-default
# > wpctl status,then find the id
# > wpctl inspect <id>

# Stop selections from being remembered
node.restore-default-targets = false
device.restore-profile = false

monitor.bluez.properties = {
  # Workaround becuase of:
  # https://github.com/bluez/bluez/issues/1922
  bluez5.roles = [ a2dp_source hsp_ag hfp_ag ]
}

monitor.bluez.rules = [
  {
    matches = [
      { # airpods pro 3
        node.name = "bluez_output.CC_22_FE_2E_09_96.1"
      }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ hfp_hf hsp_hs a2dp_sink hfp_ag hsp_ag a2dp_source ]
        api.bluez5.codec = "aac"
        api.bluez5.profile = "a2dp-sink"
        priority.session = 1200
      }
    }
  }
  {
    matches = [
      { # bose soundlink flex
        node.name = "bluez_output.BC_87_FA_62_29_53.1"
      }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ hfp_hf hsp_hs a2dp_sink hfp_ag hsp_ag a2dp_source ]
        api.bluez5.codec = "sbc_xq"
        api.bluez5.profile = "a2dp-sink"
        priority.session = 1100
      }
    }
  }
]

monitor.alsa.rules = [
  {
    matches = [
      { # panasonic tv marq
        node.name = "alsa_output.pci-0000_07_00.1.HiFi__HDMI1__sink"
      }
    ]
    actions = {
      update-props = {
        device.profile.description = "HDMI / DisplayPort 1 Output"
        device.profile.name = "HiFi: HDMI1: sink"
        priority.session = 2000
